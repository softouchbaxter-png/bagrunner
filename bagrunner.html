<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#174c32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bagrunner">
<title>Bagrunner - Brigantes Driver</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --page: #eef4ef;
  --ink: #092015;
  --muted: #5f7669;
  --panel: #ffffff;
  --panel-soft: #f7fbf8;
  --line: #d7e4dc;
  --green: #174c32;
  --green-2: #236b45;
  --mint: #dff4e5;
  --mint-2: #c8ecd2;
  --gold: #b7791f;
  --gold-bg: #fff5dc;
  --red: #9f1d1d;
  --red-bg: #fde8e8;
  --shadow: 0 14px 34px rgba(15, 46, 30, 0.12);
  --mono: "DM Mono", monospace;
  --sans: "DM Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans); }
body { padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }
button, input { font: inherit; }
button { cursor: pointer; }
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--green);
  color: white;
  box-shadow: 0 8px 22px rgba(9, 32, 21, 0.18);
}
.header-inner { padding: 14px 16px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { min-width: 0; }
.brand-title { font-size: 25px; line-height: 1; font-weight: 900; letter-spacing: 0; }
.brand-sub { margin-top: 3px; color: #bce9c8; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
.icon-btn {
  min-width: 42px;
  height: 42px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.08);
  color: white;
  padding: 0 10px;
  font-weight: 900;
}
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid rgba(255,255,255,0.12); }
.metric { padding: 10px 10px 12px; border-right: 1px solid rgba(255,255,255,0.12); min-width: 0; }
.metric:last-child { border-right: 0; }
.metric-value { display: block; color: #79f1a0; font-family: var(--mono); font-size: 18px; line-height: 1.1; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.metric-label { display: block; margin-top: 3px; color: #c8ecd2; font-size: 10px; line-height: 1.1; text-transform: uppercase; font-weight: 800; letter-spacing: 0.05em; }
.progress { height: 3px; background: rgba(255,255,255,0.12); }
.progress-fill { height: 100%; width: 0; background: #79f1a0; transition: width .25s ease; }
.day-tabs {
  position: sticky;
  top: 117px;
  z-index: 25;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 12px;
  background: rgba(238,244,239,0.96);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  scrollbar-width: none;
}
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 11px;
  background: var(--panel);
  color: var(--green);
  min-width: 102px;
  text-align: left;
}
.day-tab.active { background: var(--green); color: white; border-color: var(--green); }
.day-name { display: block; font-size: 12px; font-weight: 900; text-transform: uppercase; line-height: 1.1; }
.day-meta { display: block; margin-top: 3px; font-family: var(--mono); font-size: 11px; opacity: .78; }
.content { flex: 1; width: 100%; max-width: 780px; margin: 0 auto; padding: 12px 12px 34px; }
.route-summary {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 12px;
}
.summary-head { background: var(--green); color: white; padding: 14px 14px 12px; }
.summary-title { font-size: 19px; font-weight: 900; line-height: 1.22; }
.summary-pills { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
.pill { display: inline-flex; align-items: center; min-height: 28px; padding: 5px 9px; border-radius: 8px; background: var(--mint); color: var(--green); font-size: 12px; font-weight: 900; }
.summary-actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px; }
.primary-btn { border: 0; border-radius: 8px; min-height: 48px; padding: 12px 14px; background: #2eaf53; color: white; font-weight: 900; font-size: 15px; }
.secondary-btn { border: 1px solid var(--line); border-radius: 8px; min-height: 48px; padding: 12px 14px; background: white; color: var(--green); font-weight: 900; }
.error { background: var(--red-bg); color: var(--red); border: 1px solid #f4b6b6; border-radius: 8px; padding: 13px 14px; margin: 12px 0; line-height: 1.45; font-size: 14px; font-weight: 700; }
.stop-list { display: flex; flex-direction: column; gap: 10px; }
.stop-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(15,46,30,0.08);
}
.stop-card.done { opacity: .58; }
.stop-main { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; padding: 14px; align-items: start; }
.stop-number { width: 42px; height: 42px; border-radius: 8px; background: var(--green); color: white; display: grid; place-items: center; font-weight: 900; font-size: 18px; }
.stop-card.pickup .stop-number { background: var(--gold); }
.stop-card.deliver .stop-number { background: var(--green); }
.stop-card.home .stop-number { background: #b7c8bd; color: var(--green); }
.stop-body { min-width: 0; }
.stop-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.action-chip, .bag-chip { border-radius: 8px; padding: 4px 8px; font-size: 12px; font-weight: 900; }
.action-chip.pickup { background: var(--gold-bg); color: #7a4b08; }
.action-chip.deliver { background: var(--mint); color: var(--green); }
.action-chip.home { background: #eef2ef; color: var(--muted); }
.bag-chip { background: var(--panel-soft); border: 1px solid var(--line); color: var(--green); }
.stop-hotel { font-size: 20px; font-weight: 950; line-height: 1.18; overflow-wrap: anywhere; }
.stop-customer { margin-top: 6px; color: var(--muted); font-size: 15px; font-weight: 650; }
.stop-mile { font-family: var(--mono); font-size: 15px; font-weight: 900; color: var(--green); background: var(--panel-soft); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; white-space: nowrap; }
.stop-actions { display: grid; grid-template-columns: 1fr 54px; gap: 8px; padding: 0 14px 14px; }
.done-btn { border: 0; border-radius: 8px; min-height: 48px; background: #2eaf53; color: white; font-weight: 900; }
.done-btn.undo { background: #dbe8df; color: var(--green); }
.map-btn { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-soft); color: var(--green); font-weight: 900; display: grid; place-items: center; text-decoration: none; }
.proof-row { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 0 14px 14px; }
.proof-label { border: 1px dashed #b8cfc1; background: white; color: var(--green); border-radius: 8px; min-height: 44px; display: grid; place-items: center; font-weight: 900; }
.proof-label input { display: none; }
.day-total { margin-top: 12px; background: var(--green); color: white; border-radius: 8px; padding: 14px; display: grid; gap: 8px; }
.day-total-title { font-weight: 900; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #c8ecd2; }
.day-total-line { display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 15px; font-weight: 900; }
.config-screen { position: fixed; inset: 0; z-index: 80; display: none; background: var(--page); overflow-y: auto; padding: 18px; }
.config-screen.show { display: block; }
.config-card { max-width: 620px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
.config-head { background: var(--green); color: white; padding: 18px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.config-title { font-size: 24px; font-weight: 950; }
.close-btn { width: 40px; height: 40px; border-radius: 8px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.1); color: white; font-size: 18px; }
.config-body { padding: 16px; }
.field { margin-bottom: 14px; }
.field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; }
.field input { width: 100%; border: 1px solid var(--line); border-radius: 8px; min-height: 46px; padding: 11px 12px; background: var(--panel-soft); color: var(--ink); }
.helper { color: var(--muted); font-size: 13px; line-height: 1.45; background: var(--panel-soft); border: 1px solid var(--line); padding: 12px; border-radius: 8px; }
.loading { min-height: 44vh; display: grid; place-items: center; text-align: center; color: var(--muted); }
.loading strong { display: block; color: var(--green); font-size: 26px; font-weight: 950; margin-bottom: 8px; }
@media (max-width: 520px) {
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metric:nth-child(2) { border-right: 0; }
  .metric:nth-child(3), .metric:nth-child(4) { border-top: 1px solid rgba(255,255,255,0.12); }
  .day-tabs { top: 170px; }
  .content { padding-top: 10px; }
  .stop-main { grid-template-columns: 42px 1fr; }
  .stop-mile { grid-column: 2; justify-self: start; margin-top: 2px; }
  .summary-actions { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-title">Bagrunner</div>
        <div class="brand-sub">Brigantes Driver</div>
      </div>
      <button class="icon-btn" type="button" onclick="showConfig()" aria-label="Settings">Settings</button>
    </div>
    <div class="metrics">
      <div class="metric"><span class="metric-value" id="statMiles">--</span><span class="metric-label">Miles</span></div>
      <div class="metric"><span class="metric-value" id="statEarned">--</span><span class="metric-label">Earned</span></div>
      <div class="metric"><span class="metric-value" id="statTime">--</span><span class="metric-label">Time</span></div>
      <div class="metric"><span class="metric-value" id="statDone">0/0</span><span class="metric-label">Done</span></div>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  </header>

  <nav class="day-tabs" id="dayTabs" aria-label="Route days"></nav>

  <main class="content" id="main">
    <div class="loading"><div><strong>Bagrunner</strong>Loading your route...</div></div>
  </main>
</div>

<div class="config-screen" id="configScreen">
  <div class="config-card">
    <div class="config-head">
      <div>
        <div class="config-title">Setup</div>
        <div style="color:#c8ecd2;font-weight:800;font-size:13px;margin-top:3px">Connect the app to the Manifest sheet.</div>
      </div>
      <button class="close-btn" type="button" onclick="hideConfig()" aria-label="Close">x</button>
    </div>
    <div class="config-body">
      <div class="field"><label>Google Sheets API key</label><input type="text" id="cfgSheetsKey" placeholder="AIza..."></div>
      <div class="field"><label>Spreadsheet ID</label><input type="text" id="cfgSheetId" placeholder="18ZCSv..."></div>
      <div class="field"><label>Manifest tab name</label><input type="text" id="cfgSheetName" value="Manifest"></div>
      <div class="field"><label>Rate per mile</label><input type="number" id="cfgRate" value="0.92" step="0.01"></div>
      <button class="primary-btn" type="button" onclick="saveConfigAndLoad()" style="width:100%">Save and load routes</button>
      <p class="helper">The Google Sheet must be shared so the Sheets API can read it. This app only reads the Manifest tab and stores completion/proof-photo state on this device.</p>
    </div>
  </div>
</div>

<script>
var CONFIG = {
  sheetsKey: localStorage.getItem('br_sheetsKey') || '',
  sheetId: localStorage.getItem('br_sheetId') || '18ZCSvdubVDLnweOqHEgxrbldM_DyVlVVfEVMrxnHmUQ',
  sheetName: localStorage.getItem('br_sheetName') || 'Manifest',
  ratePerMile: parseFloat(localStorage.getItem('br_rate')) || 0.92
};
var APP = {
  days: [],
  currentDayIdx: 0,
  completed: JSON.parse(localStorage.getItem('br_completed') || '{}'),
  proofs: JSON.parse(localStorage.getItem('br_proofs') || '{}')
};
var ACTION_PICKUP = 'PICKUP';
var ACTION_DELIVER = 'DELIVER';
var ACTION_START = 'START';
var ACTION_RETURN = 'RETURN HOME';

window.addEventListener('load', function() {
  document.getElementById('cfgSheetsKey').value = CONFIG.sheetsKey;
  document.getElementById('cfgSheetId').value = CONFIG.sheetId;
  document.getElementById('cfgSheetName').value = CONFIG.sheetName;
  document.getElementById('cfgRate').value = CONFIG.ratePerMile;
  if (!CONFIG.sheetsKey) showConfig();
  loadManifest();
});

function showConfig() { document.getElementById('configScreen').classList.add('show'); }
function hideConfig() { document.getElementById('configScreen').classList.remove('show'); }
function saveConfigAndLoad() {
  CONFIG.sheetsKey = document.getElementById('cfgSheetsKey').value.trim();
  CONFIG.sheetId = document.getElementById('cfgSheetId').value.trim();
  CONFIG.sheetName = document.getElementById('cfgSheetName').value.trim() || 'Manifest';
  CONFIG.ratePerMile = parseFloat(document.getElementById('cfgRate').value) || 0.92;
  localStorage.setItem('br_sheetsKey', CONFIG.sheetsKey);
  localStorage.setItem('br_sheetId', CONFIG.sheetId);
  localStorage.setItem('br_sheetName', CONFIG.sheetName);
  localStorage.setItem('br_rate', CONFIG.ratePerMile);
  hideConfig();
  loadManifest();
}

async function loadManifest() {
  showLoading();
  if (!CONFIG.sheetsKey) {
    showError('Add your Google Sheets API key in Settings, then load routes.');
    return;
  }
  var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + CONFIG.sheetId +
    '/values/' + encodeURIComponent(CONFIG.sheetName) + '!A1:G350?key=' + CONFIG.sheetsKey;
  try {
    var resp = await fetch(url);
    if (!resp.ok) {
      var err = await resp.json().catch(function(){ return {}; });
      throw new Error(err.error ? err.error.message : 'Status ' + resp.status);
    }
    var data = await resp.json();
    APP.days = parseManifest(data.values || []);
    if (!APP.days.length) {
      showError('No route data found. Run the email check and route calculator in the Google Sheet first.');
      return;
    }
    APP.currentDayIdx = findTodayIdx();
    renderAll();
  } catch(e) {
    showError('Could not load the Manifest: ' + e.message);
  }
}

function parseManifest(rows) {
  var days = [];
  var currentDay = null;
  var dayNames = ['MON', 'TUES', 'WEDS', 'THUR', 'FRI', 'SAT', 'SUN'];

  rows.forEach(function(row, i) {
    var col0 = cleanCell(row[0]);
    var col1 = cleanCell(row[1]).toUpperCase();
    var col2 = cleanCell(row[2]);
    var col3 = cleanCell(row[3]);
    var col4 = cleanCell(row[4]);
    var col5 = cleanCell(row[5]);
    var col6 = cleanCell(row[6]);
    var upper0 = col0.toUpperCase();
    var isDayHeader = dayNames.some(function(day) { return upper0.indexOf(day) !== -1; }) && upper0.indexOf('TOTAL') === -1;
    if (!isDayHeader && upper0.indexOf('TAP TO OPEN ROUTE') !== -1) isDayHeader = true;

    if (isDayHeader) {
      if (currentDay) days.push(currentDay);
      currentDay = {
        label: cleanDayLabel(col0),
        mapsUrl: extractMapsUrl(col0),
        stops: [],
        totalMiles: 0,
        earnings: 0,
        estimatedTime: '',
        estimatedFinish: ''
      };
      return;
    }
    if (!currentDay) return;

    if (col3.toUpperCase() === 'DAY TOTAL' || col4.toUpperCase() === 'DAY TOTAL') {
      var milesText = col4.indexOf('miles') !== -1 ? col4 : col5;
      var moneyText = col5.indexOf('£') !== -1 ? col5 : col6;
      currentDay.totalMiles = parseFloat(String(milesText).replace(/[^0-9.]/g, '')) || 0;
      currentDay.earnings = parseFloat(String(moneyText).replace(/[^0-9.]/g, '')) || (currentDay.totalMiles * CONFIG.ratePerMile);
      parseTimeNote(currentDay, col6);
      return;
    }

    if (col0.indexOf('WEEK TOTAL') !== -1) return;
    if (col1 === 'ACTION' || col2 === 'HOTEL') return;

    if (col1 === ACTION_START) {
      currentDay.stops.push({ type: 'home', action: 'START', hotel: 'Home Base', customers: '', bags: '', miles: '', id: 'start_' + i });
      return;
    }
    if (col1 === ACTION_RETURN) {
      currentDay.stops.push({ type: 'home', action: 'RETURN HOME', hotel: 'Home Base', customers: '', bags: '', miles: col5, id: 'return_' + i });
      return;
    }
    if (col1 === ACTION_PICKUP && col2) {
      currentDay.stops.push({ type: 'pickup', action: 'PICKUP', hotel: col2, customers: col3, bags: col4, miles: col5, id: 'stop_' + i });
      return;
    }
    if (col1 === ACTION_DELIVER && col2) {
      currentDay.stops.push({ type: 'deliver', action: 'DELIVER', hotel: col2, customers: col3, bags: col4, miles: col5, id: 'stop_' + i });
    }
  });
  if (currentDay) days.push(currentDay);
  return days.filter(function(day) { return day.stops.length > 0; });
}

function cleanCell(value) { return String(value || '').replace(/\s+/g, ' ').trim(); }
function cleanDayLabel(value) {
  return cleanCell(value)
    .replace(/^[^A-Za-z0-9]*/, '')
    .replace(/- Tap to Open Route in Google Maps.*/i, '')
    .replace(/—.*$/g, '')
    .trim() || 'Route day';
}
function extractMapsUrl(value) {
  var match = String(value || '').match(/https:\/\/www\.google\.com\/maps\/dir\/[^\s")]+/);
  return match ? decodeURIComponent(match[0]) : '';
}
function parseTimeNote(day, note) {
  var text = cleanCell(note);
  if (!text) return;
  var timeMatch = text.match(/Est\. time:\s*([^|]+)/i);
  if (timeMatch) day.estimatedTime = timeMatch[1].trim();
  var finishMatch = text.match(/Finish if leaving now:\s*([^|]+)/i);
  if (finishMatch) day.estimatedFinish = finishMatch[1].trim();
}

function findTodayIdx() {
  var today = new Date();
  var dayName = ['Sun','Mon','Tues','Weds','Thur','Fri','Sat'][today.getDay()].toLowerCase();
  var date = String(today.getDate());
  for (var i = 0; i < APP.days.length; i++) {
    var label = APP.days[i].label.toLowerCase();
    if (label.indexOf(dayName) !== -1 && label.indexOf(date) !== -1) return i;
  }
  for (var j = 0; j < APP.days.length; j++) {
    var actionable = getActionStops(APP.days[j]).length;
    var done = getDoneCount(APP.days[j]);
    if (done < actionable) return j;
  }
  return 0;
}

function renderAll() { renderTabs(); renderDay(APP.currentDayIdx); }
function renderTabs() {
  var tabs = document.getElementById('dayTabs');
  tabs.innerHTML = APP.days.map(function(day, idx) {
    return '<button type="button" class="day-tab ' + (idx === APP.currentDayIdx ? 'active' : '') + '" onclick="switchDay(' + idx + ')">' +
      '<span class="day-name">' + escapeHtml(day.label) + '</span>' +
      '<span class="day-meta">' + (day.totalMiles ? day.totalMiles.toFixed(1) + ' mi' : '--') + (day.estimatedTime ? ' | ' + escapeHtml(day.estimatedTime) : '') + '</span>' +
      '</button>';
  }).join('');
}
function switchDay(idx) { APP.currentDayIdx = idx; renderAll(); window.scrollTo(0, 0); }

function renderDay(idx) {
  var day = APP.days[idx];
  if (!day) return;
  var stops = getActionStops(day);
  var done = getDoneCount(day);
  var completion = stops.length ? Math.round((done / stops.length) * 100) : 0;

  document.getElementById('statMiles').textContent = day.totalMiles ? day.totalMiles.toFixed(1) : '--';
  document.getElementById('statEarned').textContent = day.earnings ? '£' + day.earnings.toFixed(2) : '--';
  document.getElementById('statTime').textContent = day.estimatedTime || estimateTimeFromStops(day);
  document.getElementById('statDone').textContent = done + '/' + stops.length;
  document.getElementById('progressFill').style.width = completion + '%';

  var html = '<section class="route-summary">' +
    '<div class="summary-head"><div class="summary-title">' + escapeHtml(day.label) + '</div>' +
    '<div class="summary-pills">' +
      '<span class="pill">' + stops.length + ' stops</span>' +
      '<span class="pill">' + (day.totalMiles ? day.totalMiles.toFixed(1) + ' mi' : '--') + '</span>' +
      '<span class="pill">' + (day.estimatedTime || estimateTimeFromStops(day)) + '</span>' +
      (day.estimatedFinish ? '<span class="pill">Finish ' + escapeHtml(day.estimatedFinish) + '</span>' : '') +
    '</div></div>' +
    '<div class="summary-actions">' +
      '<button class="primary-btn" type="button" onclick="openFullRoute()">Open full route</button>' +
      '<button class="secondary-btn" type="button" onclick="loadManifest()">Refresh</button>' +
    '</div></section>';

  html += '<section class="stop-list">';
  day.stops.forEach(function(stop, index) { html += renderStop(day, stop, index); });
  html += '</section>';
  if (day.totalMiles) {
    html += '<section class="day-total"><div class="day-total-title">Day total</div>' +
      '<div class="day-total-line"><span>Miles</span><span>' + day.totalMiles.toFixed(1) + ' mi</span></div>' +
      '<div class="day-total-line"><span>Earnings</span><span>£' + day.earnings.toFixed(2) + '</span></div>' +
      '<div class="day-total-line"><span>Time</span><span>' + (day.estimatedTime || estimateTimeFromStops(day)) + '</span></div>' +
      (day.estimatedFinish ? '<div class="day-total-line"><span>Finish</span><span>' + escapeHtml(day.estimatedFinish) + '</span></div>' : '') +
      '</section>';
  }
  document.getElementById('main').innerHTML = html;
}

function renderStop(day, stop, index) {
  var actionable = stop.type === 'pickup' || stop.type === 'deliver';
  var done = actionable && isDone(day, stop);
  var proofKey = proofId(day, stop);
  var hasProof = !!APP.proofs[proofKey];
  var actionClass = stop.type === 'pickup' ? 'pickup' : stop.type === 'deliver' ? 'deliver' : 'home';
  var number = actionable ? getActionNumber(day, index) : (stop.action === 'START' ? 'S' : 'H');
  var mapHref = stop.type === 'home' ? '' : makeStopMapLink(stop);

  var html = '<article class="stop-card ' + actionClass + (done ? ' done' : '') + '">' +
    '<div class="stop-main"><div class="stop-number">' + number + '</div><div class="stop-body">' +
    '<div class="stop-row"><span class="action-chip ' + actionClass + '">' + escapeHtml(stop.action || 'HOME') + '</span>' +
    (stop.bags ? '<span class="bag-chip">' + escapeHtml(stop.bags) + '</span>' : '') + '</div>' +
    '<div class="stop-hotel">' + escapeHtml(stop.hotel) + '</div>' +
    (stop.customers ? '<div class="stop-customer">' + escapeHtml(stop.customers) + '</div>' : '') +
    '</div>' + (stop.miles ? '<div class="stop-mile">' + escapeHtml(stop.miles) + ' mi</div>' : '') + '</div>';

  if (actionable) {
    html += '<div class="proof-row"><label class="proof-label">' + (hasProof ? 'Proof photo added' : 'Add proof photo') +
      '<input type="file" accept="image/*" capture="environment" onchange="saveProof(event, \'' + escapeJs(proofKey) + '\')"></label></div>';
    html += '<div class="stop-actions"><button type="button" class="done-btn ' + (done ? 'undo' : '') + '" onclick="toggleDone(\'' + escapeJs(day.label) + '\',\'' + escapeJs(stop.id) + '\')">' +
      (done ? 'Done - tap to undo' : 'Mark done') + '</button>' +
      '<a class="map-btn" href="' + mapHref + '" target="_blank" aria-label="Open stop map">Map</a></div>';
  }
  html += '</article>';
  return html;
}

function getActionStops(day) { return day.stops.filter(function(s) { return s.type === 'pickup' || s.type === 'deliver'; }); }
function getActionNumber(day, stopIndex) {
  var count = 0;
  for (var i = 0; i <= stopIndex; i++) if (day.stops[i].type === 'pickup' || day.stops[i].type === 'deliver') count++;
  return count;
}
function getDoneCount(day) {
  var bucket = APP.completed[day.label] || {};
  return getActionStops(day).filter(function(stop) { return bucket[stop.id]; }).length;
}
function isDone(day, stop) { return !!((APP.completed[day.label] || {})[stop.id]); }
function toggleDone(dayLabel, stopId) {
  if (!APP.completed[dayLabel]) APP.completed[dayLabel] = {};
  if (APP.completed[dayLabel][stopId]) delete APP.completed[dayLabel][stopId]; else APP.completed[dayLabel][stopId] = true;
  localStorage.setItem('br_completed', JSON.stringify(APP.completed));
  renderAll();
}
function proofId(day, stop) { return day.label + '|' + stop.id; }
function saveProof(event, key) {
  var file = event.target.files && event.target.files[0];
  if (!file) return;
  APP.proofs[key] = { name: file.name, date: new Date().toISOString() };
  localStorage.setItem('br_proofs', JSON.stringify(APP.proofs));
  renderAll();
}
function estimateTimeFromStops(day) {
  var stops = getActionStops(day).length;
  if (!day.totalMiles && !stops) return '--';
  var driveMins = Math.ceil((day.totalMiles || 0) / 25 * 60);
  return formatMinutes(driveMins + (stops * 5));
}
function formatMinutes(minutes) {
  minutes = Math.round(Number(minutes) || 0);
  var h = Math.floor(minutes / 60);
  var m = minutes % 60;
  if (!h) return m + ' mins';
  return h + 'h' + (m ? ' ' + m + 'm' : '');
}
function makeStopMapLink(stop) { return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(stop.hotel + ', Lake District, UK') + '&travelmode=driving'; }
function openFullRoute() {
  var day = APP.days[APP.currentDayIdx];
  if (!day) return;
  if (day.mapsUrl) { window.open(day.mapsUrl, '_blank'); return; }
  var parts = ['3 Birch Street, Windermere, LA23 1EG'];
  getActionStops(day).forEach(function(stop) { parts.push(stop.hotel + ', Lake District, UK'); });
  parts.push('3 Birch Street, Windermere, LA23 1EG');
  window.open('https://www.google.com/maps/dir/' + parts.map(encodeURIComponent).join('/'), '_blank');
}
function showLoading() { document.getElementById('main').innerHTML = '<div class="loading"><div><strong>Bagrunner</strong>Loading your route...</div></div>'; }
function showError(message) {
  document.getElementById('main').innerHTML = '<div class="error">' + escapeHtml(message) + '</div>' +
    '<button class="primary-btn" type="button" onclick="showConfig()" style="width:100%;margin-top:12px">Open settings</button>';
}
function escapeHtml(value) { return String(value || '').replace(/[&<>"]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function escapeJs(value) { return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

if ('serviceWorker' in navigator) {
  var swCode = "self.addEventListener('install',function(e){self.skipWaiting();});self.addEventListener('fetch',function(e){if(e.request.url.includes('sheets.googleapis.com'))return;e.respondWith(fetch(e.request).catch(function(){return caches.match(e.request);}));});";
  var blob = new Blob([swCode], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function(){});
}
</script>
</body>
